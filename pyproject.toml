[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghg-toolkit"
version = "0.1.0"
description = "IPCC 2006 Tier 1 GHG emission calculators and mitigation scenarios for Chile"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
